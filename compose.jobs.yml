services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: graydev
      POSTGRES_DB: graydev_jobs
      POSTGRES_PASSWORD: ${JOBS_POSTGRES_PASSWORD:?Set JOBS_POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jobs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graydev -d graydev_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jobs-postgres-data:
